<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>archivus-sync dashboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: #d0d7de;
      --muted: #6b7280;
      --bg: #ffffff;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #30363d;
        --muted: #9da7b3;
        --bg: #161b22;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: inherit;
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.25rem; margin: 0; }
    h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; }
    main { padding: 0 1.5rem 2rem; }
    .muted { color: var(--muted); }
    .path { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .pill {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: 0.5rem;
    }

    .cards {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
    }
    .card.stat {
      flex: 1 1 12rem;
      min-width: 10rem;
    }
    .card.stat .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .card.stat .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.2;
    }

    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td {
      text-align: left;
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      word-break: break-all;
    }
    th { position: sticky; top: 0; background: var(--bg); }
    tr:last-child td { border-bottom: none; }

    .row-tracked { margin-bottom: 0.35rem; }

    .file { border-bottom: 1px solid var(--border); }
    .file:last-child { border-bottom: none; }
    .file summary {
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0.35rem;
      list-style: none;
    }
    .file summary::-webkit-details-marker { display: none; }
    .file summary::before {
      content: "▸";
      color: var(--muted);
      margin-right: 0.5rem;
      transition: transform 0.15s;
      flex: 0 0 auto;
    }
    .file[open] summary::before { transform: rotate(90deg); }
    .file summary .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .file summary .size { flex: 0 0 auto; }
    .file .details {
      padding: 0 0.35rem 0.6rem 1.4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .file .details .path { word-break: break-all; }

    .error {
      border: 1px solid #f85149;
      color: #f85149;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>archivus-sync <span class="pill" id="server"></span></h1>
    <div class="muted" id="user"></div>
    <div class="muted" id="lastLoaded"></div>
  </header>
  <main>
    <section class="cards">
      <div class="card stat">
        <div class="stat-label">Files uploaded</div>
        <div class="stat-value" id="fileCount">–</div>
      </div>
      <div class="card stat">
        <div class="stat-label">Pending uploads</div>
        <div class="stat-value" id="pendingCount">–</div>
      </div>
    </section>

    <section>
      <h2>Pending uploads</h2>
      <div class="card" id="pending">Loading…</div>
    </section>

    <section>
      <h2>Uploaded files</h2>
      <div class="card" id="files"></div>
      <div class="muted" id="status"></div>
      <div id="sentinel"></div>
    </section>

    <section>
      <h2>Tracked folders</h2>
      <div class="card" id="tracked">Loading…</div>
    </section>

    <div id="error"></div>
  </main>

  <script>
    const PAGE_SIZE = 50;
    const errBox = document.getElementById('error');
    const filesEl = document.getElementById('files');
    const statusEl = document.getElementById('status');
    const sentinel = document.getElementById('sentinel');

    let offset = 0;
    let total = 0;
    let loading = false;
    let done = false;

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.toggle('error', !!msg);
    }

    async function loadSummary() {
      try {
        const [cfg, state] = await Promise.all([
          fetch('/api/config', { cache: 'no-store' }).then(r => r.json()),
          fetch('/api/state', { cache: 'no-store' }).then(r => r.json()),
        ]);

        document.getElementById('server').textContent = cfg.serverUrl || 'not configured';
        document.getElementById('user').textContent = cfg.username
          ? `Signed in as ${cfg.username}`
          : 'Not signed in';

        renderTracked(cfg.tracked || []);
        document.getElementById('fileCount').textContent = state.totalFiles;
        renderPending(state.pending || {});

        document.getElementById('lastLoaded').textContent =
          'Last refreshed ' + new Date().toLocaleTimeString();
        showError('');
      } catch (err) {
        showError('Could not load dashboard data: ' + err);
      }
    }

    async function loadFiles(reset) {
      if (loading || (done && !reset)) return;
      if (reset) {
        offset = 0;
        total = 0;
        done = false;
        filesEl.innerHTML = '';
      }
      loading = true;
      try {
        const res = await fetch(`/api/files?offset=${offset}&limit=${PAGE_SIZE}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        total = data.total;
        if (reset) document.getElementById('fileCount').textContent = total;
        appendFiles(data.files || []);
        offset += (data.files || []).length;
        if (offset >= total || !(data.files || []).length) done = true;
        updateStatus();
      } catch (err) {
        showError('Could not load files: ' + err);
      } finally {
        loading = false;
        if (!done && isSentinelVisible()) loadFiles();
      }
    }

    function updateStatus() {
      if (total === 0) statusEl.textContent = 'No synced files recorded yet.';
      else if (done) statusEl.textContent = `All ${total} files loaded.`;
      else statusEl.textContent = `Loaded ${offset} of ${total} files.`;
    }

    function appendFiles(files) {
      const frag = document.createDocumentFragment();
      for (const f of files) frag.appendChild(fileRow(f));
      filesEl.appendChild(frag);
    }

    function fileRow(f) {
      const d = document.createElement('details');
      d.className = 'file';

      const summary = document.createElement('summary');
      const name = document.createElement('span');
      name.className = 'path';
      name.textContent = f.path;
      const size = document.createElement('span');
      size.className = 'muted size';
      size.textContent = humanSize(f.size);
      summary.appendChild(name);
      summary.appendChild(size);
      d.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'details';
      const modified = document.createElement('div');
      modified.textContent = 'Modified: ' + humanDate(f.modTime);
      const checksum = document.createElement('div');
      checksum.textContent = 'Checksum: ';
      const checksumCode = document.createElement('span');
      checksumCode.className = 'path';
      checksumCode.textContent = f.checksum || '';
      checksum.appendChild(checksumCode);
      body.appendChild(modified);
      body.appendChild(checksum);
      d.appendChild(body);

      return d;
    }

    function renderTracked(tracked) {
      const el = document.getElementById('tracked');
      if (!tracked.length) {
        el.innerHTML = '<span class="muted">No tracked folders.</span>';
        return;
      }
      el.innerHTML = tracked.map(tf => `
        <div class="row-tracked">
          <span class="path">${escapeHtml(tf.localPath || tf.LocalPath)}</span>
          <span class="muted">→ drive</span> ${escapeHtml(tf.driveId || tf.DriveID)}
          <span class="muted">/</span>${escapeHtml(tf.destRel || tf.DestRel || '')}
        </div>`).join('');
    }

    function renderPending(pending) {
      const entries = Object.entries(pending);
      document.getElementById('pendingCount').textContent = entries.length;
      const el = document.getElementById('pending');
      if (!entries.length) {
        el.innerHTML = '<span class="muted">No pending uploads.</span>';
        return;
      }
      el.innerHTML = `
        <table>
          <thead>
            <tr><th>Path</th><th>Upload ID</th><th>Size</th><th>Started</th></tr>
          </thead>
          <tbody>
            ${entries.map(([path, p]) => `
              <tr>
                <td class="path">${escapeHtml(path)}</td>
                <td class="path">${escapeHtml(p.uploadId || '')}</td>
                <td>${humanSize(p.size)}</td>
                <td>${humanDate(p.startedAt * 1000000000)}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function isSentinelVisible() {
      const r = sentinel.getBoundingClientRect();
      return r.top < window.innerHeight && r.bottom > 0;
    }

    function humanSize(n) {
      if (n === undefined || n === null || n === 0) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let v = Number(n);
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function humanDate(modTime) {
      if (!modTime) return '–';
      // state.json stores unix nanoseconds; JS dates want milliseconds.
      const ms = modTime > 1e15 ? Math.floor(modTime / 1e6) : modTime * 1000;
      const d = new Date(ms);
      if (isNaN(d.getTime())) return '–';
      return d.toLocaleString();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) loadFiles();
    }, { rootMargin: '200px' });
    observer.observe(sentinel);

    loadSummary();
    loadFiles(true);
    setInterval(loadSummary, 5000);
  </script>
</body>
</html>
